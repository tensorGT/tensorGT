<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="tensorGT">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <!-- Muted sage green background -->
  <rect width="1200" height="280" rx="8" fill="#7A8C74" />
  <rect x="1" y="1" width="1198" height="278" rx="7" fill="none" stroke="#62735C" stroke-width="1" />

  <!-- Subtle top hairline label -->
  <text x="56" y="64" class="mono" font-size="12" font-weight="500" fill="#E1E5DF" letter-spacing="0.06em">
    tensorgt / profile
  </text>

  <!-- Name -->
  <text x="56" y="128" class="sans" font-size="48" font-weight="700" fill="#F9F8F6" letter-spacing="-0.03em">
    hi, i'm tensorGT
  </text>

  <!-- Casual bio -->
  <text x="56" y="172" class="sans" font-size="18" font-weight="400" fill="#F2F4F1">
    software development engineer into distributed systems that are scalable, resource efficient, and maintainable.
  </text>
  <text x="56" y="200" class="sans" font-size="16" font-weight="400" fill="#E1E5DF">
    also have experience in offensive security and web penetration testing, which mostly just makes me double-check everything.
  </text>

  <!-- Bottom subtle tags -->
  <line x1="56" y1="226" x2="1144" y2="226" stroke="#94A38F" stroke-opacity="0.45" stroke-width="1" />
  <text x="56" y="252" class="mono" font-size="12" font-weight="400" fill="#E1E5DF">
    distributed systems  ·  resource efficiency  ·  maintainability  ·  offensive security
  </text>
</svg>
