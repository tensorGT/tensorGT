<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="tensorGT — Security Researcher, Web Penetration Tester, Systems Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="50%" stop-color="#0b1026" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4;#3b82f6;#a855f7;#ec4899;#00f5d4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#a855f7;#ec4899;#00f5d4;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#00f5d4;#3b82f6;#a855f7;#ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </linearGradient>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-opacity="0.11" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" />

  <!-- Animated Scanning Beam -->
  <rect x="0" y="-60" width="1200" height="60" fill="url(#scanBeam)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 420" dur="5.5s" repeatCount="indefinite" />
  </rect>

  <!-- Animated Radar / Orbit Rings (Left) -->
  <g transform="translate(170, 180)">
    <circle r="95" fill="none" stroke="#00f5d4" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="8 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
    </circle>
    <circle r="68" fill="none" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="14 6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite" />
    </circle>
    <circle r="40" fill="none" stroke="#3b82f6" stroke-opacity="0.45" stroke-width="2" />
    <circle r="10" fill="#00f5d4" filter="url(#glow)">
      <animate attributeName="r" values="8;13;8" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <!-- Pulse Wave -->
    <circle r="12" fill="none" stroke="#00f5d4" stroke-width="2">
      <animate attributeName="r" values="12;95" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.7;0" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating Telemetry Particles -->
  <circle cx="980" cy="70" r="3" fill="#00f5d4">
    <animate attributeName="cy" values="70;52;70" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="250" r="3.5" fill="#ec4899">
    <animate attributeName="cy" values="250;270;250" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.95;0.3" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1110" cy="130" r="2.5" fill="#a855f7">
    <animate attributeName="cx" values="1110;1092;1110" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Terminal Header Pill -->
  <g transform="translate(320, 74)">
    <rect width="290" height="28" rx="14" fill="#111827" stroke="#00f5d4" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="18" cy="14" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="18" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.8">root@tensorgt:~# ./recon --all</text>
  </g>

  <!-- Main Title -->
  <text x="320" y="176" fill="url(#neonText)" filter="url(#glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5">tensorGT</text>

  <!-- Animated Cursor -->
  <rect x="642" y="124" width="12" height="54" rx="2" fill="#00f5d4">
    <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite" />
  </rect>

  <!-- Role Subtitle -->
  <text x="322" y="222" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="600" letter-spacing="1.4">
    SECURITY RESEARCHER  ·  WEB PENETRATION TESTER  ·  SYSTEMS ENGINEER
  </text>

  <!-- Bottom Accent Line -->
  <rect x="322" y="250" width="560" height="3" rx="1.5" fill="url(#neonText)" opacity="0.85" />
  <text x="322" y="284" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    Breaking web apps · Auditing cryptography · Shipping resilient Go &amp; Rust infrastructure
  </text>
</svg>
