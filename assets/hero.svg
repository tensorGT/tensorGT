<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="hi, i'm tensorGT">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e">
        <animate attributeName="stop-color" values="#ff9a9e;#fbc2eb;#a18cd1;#ff9a9e" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#fad0c4">
        <animate attributeName="stop-color" values="#fad0c4;#a6c1ee;#fbc2eb;#fad0c4" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a18cd1">
        <animate attributeName="stop-color" values="#a18cd1;#ff9a9e;#84fab0;#a18cd1" dur="14s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="blob1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ff9a76" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="blob2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f7fd5" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#86a8e7" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="blob3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fddb92" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#d1fdff" stop-opacity="0.55" />
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4c1d95" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Vibrant Dreamy Backdrop -->
  <rect width="1200" height="380" rx="24" fill="url(#sky)" />

  <!-- Floating Organic Blobs -->
  <circle cx="190" cy="110" r="115" fill="url(#blob1)" filter="url(#softBlur)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 24 -18; 0 0" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="1010" cy="270" r="130" fill="url(#blob2)" filter="url(#softBlur)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -26 14; 0 0" dur="11s" repeatCount="indefinite" />
  </circle>
  <circle cx="660" cy="70" r="95" fill="url(#blob3)" filter="url(#softBlur)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 18 20; 0 0" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Flowing Ribbon Waves -->
  <path d="M0,295 C240,240 420,345 680,290 C900,245 1040,320 1200,275 L1200,380 L0,380 Z" fill="#ffffff" fill-opacity="0.22">
    <animate attributeName="d" values="
      M0,295 C240,240 420,345 680,290 C900,245 1040,320 1200,275 L1200,380 L0,380 Z;
      M0,280 C260,330 450,240 700,305 C920,350 1050,255 1200,295 L1200,380 L0,380 Z;
      M0,295 C240,240 420,345 680,290 C900,245 1040,320 1200,275 L1200,380 L0,380 Z" dur="10s" repeatCount="indefinite" />
  </path>
  <path d="M0,325 C280,285 480,360 760,315 C960,285 1080,340 1200,310 L1200,380 L0,380 Z" fill="#ffffff" fill-opacity="0.28">
    <animate attributeName="d" values="
      M0,325 C280,285 480,360 760,315 C960,285 1080,340 1200,310 L1200,380 L0,380 Z;
      M0,310 C250,350 510,275 740,330 C940,370 1090,290 1200,325 L1200,380 L0,380 Z;
      M0,325 C280,285 480,360 760,315 C960,285 1080,340 1200,310 L1200,380 L0,380 Z" dur="8s" repeatCount="indefinite" />
  </path>

  <!-- Frosted Glass Center Pill -->
  <rect x="210" y="76" width="780" height="218" rx="28" fill="#ffffff" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2" filter="url(#cardShadow)" />

  <!-- Decorative Twinkling 4-Point Sparkles (pure vector shapes) -->
  <g transform="translate(262, 118)" fill="#ff5e99">
    <path d="M0,-14 Q2,-2 14,0 Q2,2 0,14 Q-2,2 -14,0 Q-2,-2 0,-14 Z">
      <animateTransform attributeName="transform" type="scale" values="0.8;1.2;0.8" dur="3s" repeatCount="indefinite" />
    </path>
  </g>
  <g transform="translate(932, 242)" fill="#8b5cf6">
    <path d="M0,-12 Q1.8,-1.8 12,0 Q1.8,1.8 0,12 Q-1.8,1.8 -12,0 Q-1.8,-1.8 0,-12 Z">
      <animateTransform attributeName="transform" type="scale" values="1.15;0.75;1.15" dur="3.4s" repeatCount="indefinite" />
    </path>
  </g>
  <g transform="translate(918, 114)" fill="#f59e0b">
    <path d="M0,-9 Q1.4,-1.4 9,0 Q1.4,1.4 0,9 Q-1.4,1.4 -9,0 Q-1.4,-1.4 0,-9 Z">
      <animateTransform attributeName="transform" type="rotate" values="0;45;0" dur="5s" repeatCount="indefinite" />
    </path>
  </g>
  <g transform="translate(278, 244)" fill="#ec4899">
    <circle r="6" opacity="0.75">
      <animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Main Friendly Text -->
  <text x="600" y="168" text-anchor="middle" fill="#2e1065" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="-1">
    hi, i'm tensorGT
  </text>

  <text x="600" y="214" text-anchor="middle" fill="#6b21a8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
    software dev engineer · distributed systems · occasional web breaker
  </text>

  <text x="600" y="250" text-anchor="middle" fill="#7c3aed" fill-opacity="0.85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
    mostly trying to make servers behave and use less ram
  </text>
</svg>
