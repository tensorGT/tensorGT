<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 184" width="1200" height="184" role="img" aria-label="focus areas">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Card 1: Distributed Systems -->
  <g transform="translate(0, 0)">
    <rect width="384" height="184" rx="6" fill="#F9F8F6" stroke="#E1E5DF" stroke-width="1.5" />
    <!-- Phosphor-style thin server/stack icon -->
    <g transform="translate(24, 24)" fill="none" stroke="#7A8C74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="18" height="6" rx="1.5" />
      <rect x="2" y="13" width="18" height="6" rx="1.5" />
      <line x1="6" y1="6" x2="6.01" y2="6" />
      <line x1="6" y1="16" x2="6.01" y2="16" />
    </g>
    <text x="56" y="40" class="sans" font-size="15" font-weight="600" fill="#262422">distributed systems</text>
    <text x="24" y="76" class="sans" font-size="13.5" fill="#524F4B">trying to make services scale cleanly without</text>
    <text x="24" y="98" class="sans" font-size="13.5" fill="#524F4B">burning through cpu, memory, or everyone's</text>
    <text x="24" y="120" class="sans" font-size="13.5" fill="#524F4B">patience during an outage.</text>
    <text x="24" y="156" class="sans" font-size="12" font-weight="500" fill="#8A8681">scalable &amp; resource efficient</text>
  </g>

  <!-- Card 2: Maintainability -->
  <g transform="translate(408, 0)">
    <rect width="384" height="184" rx="6" fill="#F9F8F6" stroke="#E1E5DF" stroke-width="1.5" />
    <!-- Phosphor-style thin code/brackets icon -->
    <g transform="translate(24, 24)" fill="none" stroke="#7A8C74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="8 6 2 11 8 16" />
      <polyline points="14 6 20 11 14 16" />
      <line x1="12" y1="4" x2="10" y2="18" />
    </g>
    <text x="56" y="40" class="sans" font-size="15" font-weight="600" fill="#262422">maintainable code</text>
    <text x="24" y="76" class="sans" font-size="13.5" fill="#524F4B">i prefer boring, readable systems that are</text>
    <text x="24" y="98" class="sans" font-size="13.5" fill="#524F4B">easy to reason about and don't fall apart</text>
    <text x="24" y="120" class="sans" font-size="13.5" fill="#524F4B">the moment someone touches them.</text>
    <text x="24" y="156" class="sans" font-size="12" font-weight="500" fill="#8A8681">simple over clever</text>
  </g>

  <!-- Card 3: Offensive Security -->
  <g transform="translate(816, 0)">
    <rect width="384" height="184" rx="6" fill="#F9F8F6" stroke="#E1E5DF" stroke-width="1.5" />
    <!-- Phosphor-style thin shield-check icon -->
    <g transform="translate(24, 24)" fill="none" stroke="#7A8C74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 2 L19 5.5 V10.5 C19 15.2 15.5 18.8 11 20 C6.5 18.8 3 15.2 3 10.5 V5.5 Z" />
      <polyline points="8 11 10.2 13.2 14.5 8.8" />
    </g>
    <text x="56" y="40" class="sans" font-size="15" font-weight="600" fill="#262422">offensive security</text>
    <text x="24" y="76" class="sans" font-size="13.5" fill="#524F4B">background in web penetration testing and</text>
    <text x="24" y="98" class="sans" font-size="13.5" fill="#524F4B">security research, which mostly means i</text>
    <text x="24" y="120" class="sans" font-size="13.5" fill="#524F4B">notice edge cases i probably shouldn't.</text>
    <text x="24" y="156" class="sans" font-size="12" font-weight="500" fill="#8A8681">web pentesting &amp; appsec</text>
  </g>
</svg>
